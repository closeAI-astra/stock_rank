name: IRBANK archive

# IRBANK の個別銘柄ページ(信用残・空売り・貸借など)を、使えなくなる前に一度だけ保存する(暗号化して data/irbank/)。
# これからの定期取得は株探(kabutan-weekly.yml)。この IRBANK 側は全銘柄そろうまで毎日続きを取り、
# そろった後(と、3回失敗した銘柄)は IRBANK に接続せずにすぐ終わる。不要になったら Actions でこのワークフローを無効にしてよい。
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "銘柄コード(カンマ区切り。空=Future Sight の全銘柄)"
        required: false
        default: ""
      max_minutes:
        description: "この実行の上限(分)"
        required: false
        default: "300"
      delay:
        description: "リクエスト間隔(秒)"
        required: false
        default: "1.5"
  schedule:
    - cron: "17 18 * * *" # 毎日 03:17 JST(未取得の銘柄だけ進める。そろったら何もしない)

permissions:
  contents: write

concurrency:
  group: irbank-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "cryptography==43.0.3"
      - name: Check secret
        env:
          FS_PAGES_PASSWORD: ${{ secrets.FS_PAGES_PASSWORD }}
        run: |
          if [ -z "$FS_PAGES_PASSWORD" ]; then
            echo "::error::Secrets に FS_PAGES_PASSWORD(Future Sight と同じパスワード)を登録してください。"
            exit 1
          fi
      - name: Archive IRBANK pages
        env:
          FS_PAGES_PASSWORD: ${{ secrets.FS_PAGES_PASSWORD }}
        run: |
          python scripts/stock_archive.py --source irbank \
            --codes "${{ inputs.codes }}" \
            --max-minutes "${{ inputs.max_minutes || '300' }}" \
            --delay "${{ inputs.delay || '1.5' }}" \
            --raw-out raw.tar.gz.enc \
            --release-tag "irbank-raw-${{ github.run_id }}"
      - name: Upload raw HTML (encrypted) to a release
        if: ${{ !cancelled() && hashFiles('raw.tar.gz.enc') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "irbank-raw-${{ github.run_id }}" raw.tar.gz.enc \
            --target "${{ github.sha }}" --prerelease \
            --title "IRBANK raw HTML ${{ github.run_id }}" \
            --notes "IRBANK の生 HTML(暗号化)。復号: python scripts/decrypt_raw.py raw.tar.gz.enc raw.tar.gz"
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "stock-rank-bot"
          git config user.email "stock-rank-bot@users.noreply.github.com"
          if [ ! -d data/irbank ]; then echo "保存データなし"; exit 0; fi
          git add data/irbank
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "IRBANK archive $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
